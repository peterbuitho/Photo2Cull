name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --target ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS .app and .dmg
        if: runner.os == 'macOS'
        run: |
          set -eu
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          APP="Photo2Cull.app"
          BIN="target/${{ matrix.target }}/release/photo2cull"

          mkdir -p "$APP/Contents/MacOS"
          cp "$BIN" "$APP/Contents/MacOS/photo2cull"
          chmod +x "$APP/Contents/MacOS/photo2cull"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          # Ad-hoc sign (no Apple Developer account/certificate needed).
          # This isn't notarization -- Gatekeeper still shows an
          # "unidentified developer" warning -- but it gives the .app a
          # valid signature, which avoids the misleading "is damaged"
          # rejection unsigned binaries get on newer macOS and restores
          # the normal right-click "Open" bypass.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          # Stage the .app next to a symlink to /Applications so the .dmg
          # opens as the standard "drag to Applications" install UX.
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create -volname Photo2Cull -srcfolder dmg-staging -ov -format UDZO Photo2Cull.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: photo2cull-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/photo2cull
            target/${{ matrix.target }}/release/photo2cull.exe
            Photo2Cull.dmg
          if-no-files-found: ignore
